name: Build Test Version

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      create_prerelease:
        description: '创建预发布 Release'
        type: boolean
        default: true
        required: false

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Create Prerelease
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.create_prerelease) ||
      (github.event_name == 'push' && needs.build.outputs.is_prerelease == 'true')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Create test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "🧪 v${{ needs.build.outputs.version }} (测试版)"
          body: |
            ## 🧪 测试版: EasyCheckUpdate v${{ needs.build.outputs.version }}

            > ⚠️ 这是测试版本，可能包含未测试的功能，请谨慎使用。

            ### 📦 下载

            从下方 Assets 下载 `.whl` 文件，放入插件目录即可。

            ### 🔧 安装

            ```bash
            pip install endstone_easycheckupdate-*.whl
            ```

            ### 📝 提交信息

            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
