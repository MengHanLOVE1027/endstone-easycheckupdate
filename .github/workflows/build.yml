name: Build Wheel

on:
  workflow_call:
    outputs:
      version:
        description: 'Extracted version from source'
        value: ${{ jobs.build.outputs.version }}
      is_prerelease:
        description: 'Whether this is a prerelease (beta/alpha/rc/dev)'
        value: ${{ jobs.build.outputs.is_prerelease }}
      artifact_name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      # ────────────────────────────────────
      # 1. 环境准备
      # ────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      # ────────────────────────────────────
      # 2. 提取版本号
      # ────────────────────────────────────
      - name: Get version from source
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re;c=open('src/endstone_easycheckupdate/easycheckupdate_plugin.py').read();m=re.search(r'^plugin_version\s*=\s*\"(.+?)\"',c,re.M);print(m.group(1) if m else '0.0.0')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=endstone_easycheckupdate-${VERSION}-wheel" >> "$GITHUB_OUTPUT"
          echo "Source version: $VERSION"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)                         echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # ────────────────────────────────────
      # 3. 构建 Python wheel
      # ────────────────────────────────────
      - name: Build Python wheel
        run: |
          python -m build --wheel
          echo "----- dist/ -----"
          ls -la dist/

      # ────────────────────────────────────
      # 4. 上传构建产物 (Artifact)
      # ────────────────────────────────────
      - name: Upload wheel artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: endstone_easycheckupdate-${{ steps.version.outputs.version }}-wheel
          path: dist/*.whl
          retention-days: 30
