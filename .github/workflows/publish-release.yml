name: Build & Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # 仅 PR 合并时触发，关闭(未合并)则跳过
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      # ────────────────────────────────────
      # 1. 环境准备
      # ────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      # ────────────────────────────────────
      # 2. 提取版本号
      # ────────────────────────────────────
      - name: Get version from source
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re;c=open('src/endstone_easycheckupdate/easycheckupdate_plugin.py').read();m=re.search(r'^plugin_version\s*=\s*\"(.+?)\"',c,re.M);print(m.group(1) if m else '0.0.0')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Source version: $VERSION"

          # 判断是否为测试版，输出到 step outputs
          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)                         echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # ────────────────────────────────────
      # 3. 检查是否需要发布
      # ────────────────────────────────────
      - name: Check if version already released
        id: check
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create it."
          fi

      # ────────────────────────────────────
      # 4. 创建 Tag（首次发布此版本时）
      # ────────────────────────────────────
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      # ────────────────────────────────────
      # 5. 构建 Python wheel
      # ────────────────────────────────────
      - name: Build Python wheel
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          python -m build --wheel
          echo "----- dist/ -----"
          ls -la dist/

      # ────────────────────────────────────
      # 6. 收集产物
      # ────────────────────────────────────
      - name: Collect artifacts
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p artifacts

          cp dist/*.whl   artifacts/ 2>/dev/null || true

          echo "----- artifacts/ -----"
          ls -la artifacts/

      # ────────────────────────────────────
      # 7. 生成 Release 说明
      # ────────────────────────────────────
      - name: Generate release notes
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) TYPE="🧪 测试版" ;;
            *)                         TYPE="🚀 正式版" ;;
          esac

          # 获取上一版本 tag
          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${TAG}" | head -n1)

          if [ -n "$PREV_TAG" ]; then
            DETAILS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]? | select(.author.login != "github-actions[bot]")] | map("- \(.commit.message | split("\n")[0]) (@\(.author.login))") | join("\n")' \
              2>/dev/null || echo "")

            AUTHORS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]?.author.login // empty] | unique | map(select(. != "github-actions[bot]")) | map("@" + .) | join(" ")' \
              2>/dev/null || echo "")

            CHANGELOG_LINK="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            DETAILS="- 🎉 EasyCheckUpdate v${VERSION} 首次发布"
            AUTHORS=""
            CHANGELOG_LINK=""
          fi

          DETAILS="${DETAILS:-（暂无提交信息）}"
          AUTHORS="${AUTHORS:-（暂无）}"

          cat > /tmp/release_body.md <<BODYEOF
          ## ${TYPE}: EasyCheckUpdate v${VERSION}

          ### 📦 下载 · Downloads

          | 平台 | 文件 |
          |------|------|
          | 🐍 Python | \`*.whl\` |

          ### 📝 更新内容 · Changes

          ${DETAILS}

          ### 👥 贡献者 · Contributors

          ${AUTHORS}

          ### 🔧 安装 · Installation

          \`\`\`bash
          pip install endstone_easycheckupdate-*.whl
          \`\`\`

          或从下方 Assets 下载 .whl 文件，放入插件目录即可。
          BODYEOF

          if [ -n "$CHANGELOG_LINK" ]; then
            printf '\n**Full Changelog**: %s\n' "$CHANGELOG_LINK" >> /tmp/release_body.md
          fi

          {
            echo 'body<<BODYEOF'
            cat /tmp/release_body.md
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

          echo "Release notes generated"

      # ────────────────────────────────────
      # 8. 发布 Release
      # ────────────────────────────────────
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
