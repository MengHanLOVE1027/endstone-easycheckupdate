name: Build & Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      # ────────────────────────────────────
      # 提取版本号
      # ────────────────────────────────────
      - name: Get version from source
        id: version
        shell: bash
        run: |
          VERSION=$(python3 << 'PYEOF'
          import re
          c = open('src/endstone_easycheckupdate/easycheckupdate_plugin.py', encoding='utf-8').read()
          m = re.search(r'^plugin_version\s*=\s*"(.+?)"', c, re.M)
          print(m.group(1) if m else '0.0.0')
          PYEOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Source version: $VERSION"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)                         echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # ────────────────────────────────────
      # 检查是否需要发布
      # ────────────────────────────────────
      - name: Check if version already released
        id: check
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create it."
          fi

      # ────────────────────────────────────
      # 创建 Tag
      # ────────────────────────────────────
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      # ────────────────────────────────────
      # 构建 Python wheel
      # ────────────────────────────────────
      - name: Build Python wheel
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          python -m build --wheel
          echo "----- dist/ -----"
          ls -la dist/

      # ────────────────────────────────────
      # 生成 Release 说明
      # ────────────────────────────────────
      - name: Generate release notes
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) TYPE="🧪 测试版" ;;
            *)                         TYPE="🚀 正式版" ;;
          esac

          # 获取上一版本 tag
          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${TAG}" | head -n1)

          # ── 从 CHANGELOG.md 提取当前版本的分类总结 ──
          CHANGELOG_SUMMARY=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SUMMARY=$(awk -v ver="$VERSION" '
              BEGIN { found=0 }
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found && /^---$/ { exit }
              found
            ' CHANGELOG.md | awk 'NF{p=1} p' || echo "")
          fi

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]? | select(.author.login != "github-actions[bot]")] | map("- \(.commit.message | split("\n")[0]) (@\(.author.login))") | join("\n")' \
              2>/dev/null || echo "")

            AUTHORS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" \
              --jq '[.commits[]?.author.login // empty] | unique | map(select(. != "github-actions[bot]")) | map("@" + .) | join(" ")' \
              2>/dev/null || echo "")

            CHANGELOG_LINK="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          else
            COMMITS="- 🎉 EasyCheckUpdate v${VERSION} 首次发布"
            AUTHORS=""
            CHANGELOG_LINK=""
          fi

          COMMITS="${COMMITS:-（暂无提交信息）}"
          AUTHORS="${AUTHORS:-（暂无）}"

          # ── 组装 Release Body ──
          cat > /tmp/release_body.md <<BODYEOF
          ## ${TYPE}: EasyCheckUpdate v${VERSION}

          ### 📦 下载 · Downloads

          | 平台 | 文件 |
          |------|------|
          | 🐍 Python | \`*.whl\` |

          ### 📝 更新内容 · Changes
          BODYEOF

          # CHANGELOG.md 分类总结优先
          if [ -n "$CHANGELOG_SUMMARY" ]; then
            printf '%s\n\n' "$CHANGELOG_SUMMARY" >> /tmp/release_body.md
            echo '---' >> /tmp/release_body.md
            echo >> /tmp/release_body.md
            echo '<details>' >> /tmp/release_body.md
            echo '<summary>📋 原始提交记录</summary>' >> /tmp/release_body.md
            echo >> /tmp/release_body.md
          fi

          printf '%s\n' "$COMMITS" >> /tmp/release_body.md

          if [ -n "$CHANGELOG_SUMMARY" ]; then
            echo >> /tmp/release_body.md
            echo '</details>' >> /tmp/release_body.md
          fi

          cat >> /tmp/release_body.md <<BODYEOF

          ### 👥 贡献者 · Contributors

          ${AUTHORS}

          ### 🔧 安装 · Installation

          \`\`\`bash
          pip install endstone_easycheckupdate-*.whl
          \`\`\`

          或从下方 Assets 下载 .whl 文件，放入插件目录即可。
          BODYEOF

          if [ -n "$CHANGELOG_LINK" ]; then
            printf '\n**Full Changelog**: %s\n' "$CHANGELOG_LINK" >> /tmp/release_body.md
          fi

          {
            echo 'body<<BODYEOF'
            cat /tmp/release_body.md
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

          echo "Release notes generated"

      # ────────────────────────────────────
      # 发布 Release
      # ────────────────────────────────────
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────
      # 发布到 PyPI
      # ────────────────────────────────────
      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
